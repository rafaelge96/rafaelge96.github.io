<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página no encontrada — Rafael González Escobar</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<style>
  :root { --bg:#0a1626; --text:#eaf6f8; --muted:#8aa0ad; --accent:#3fd0e0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: grid; place-items: center; text-align: center; padding: 32px;
    background-image: radial-gradient(ellipse 70% 50% at 50% 120%, rgba(63,208,224,0.16), transparent 65%);
  }
  svg { width: 72px; height: 72px; }
  h1 { font-size: clamp(30px, 6vw, 46px); font-weight: 600; letter-spacing: -0.03em; margin: 24px 0 0; }
  p { color: var(--muted); margin: 14px 0 0; }
  a.btn {
    display: inline-block; margin-top: 28px; padding: 13px 26px; border-radius: 999px;
    background: var(--accent); color: var(--bg); font-weight: 600; text-decoration: none;
  }
</style>
</head>
<body>
  <div>
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <path d="M362 150 A150 150 0 1 0 362 362" fill="none" stroke="#3fd0e0" stroke-width="64" stroke-linecap="round"/>
      <circle cx="406" cy="256" r="28" fill="#eaf6f8"/>
    </svg>
    <h1>Esta órbita está vacía</h1>
    <p>La página que buscas no existe o ha cambiado de sitio.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </div>
</body>
</html>
