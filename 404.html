<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página no encontrada — Rafael González Escobar</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<style>
  :root { --bg:#ffffff; --text:#10151a; --muted:#5a6672; --accent:#12506e; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: grid; place-items: center; text-align: center; padding: 32px;
    background-image: linear-gradient(180deg, #ffffff 60%, #f7f9fb 100%);
  }
  svg { width: 72px; height: 72px; }
  h1 { font-size: clamp(30px, 6vw, 46px); font-weight: 600; letter-spacing: -0.03em; margin: 24px 0 0; }
  p { color: var(--muted); margin: 14px 0 0; }
  a.btn {
    display: inline-block; margin-top: 28px; padding: 13px 26px; border-radius: 999px;
    background: var(--accent); color: #fff; font-weight: 600; text-decoration: none;
  }
</style>
</head>
<body>
  <div>
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <rect width="512" height="512" rx="116" fill="#12506e"/>
      <text x="252" y="352" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
            font-size="290" font-weight="600" letter-spacing="-8" fill="#ffffff">R</text>
      <circle cx="386" cy="326" r="26" fill="#7fd3e8"/>
    </svg>
    <h1>Aquí no hay nada</h1>
    <p>La página que buscas no existe o ha cambiado de sitio.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </div>
</body>
</html>
